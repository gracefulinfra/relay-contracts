# Publishes a contracts release when a vX.Y.Z tag is pushed:
#   - @gracefulinfra/relay-client X.Y.Z to GitHub Packages npm
#   - the Go module tag gen/go/vX.Y.Z on the same commit
#   - a GitHub release with the bundled spec, the client tarball, and the Go stub
# The tag, clients/ts/package.json, and openapi info.version must all agree.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the gen/go tag and the GitHub release
      packages: write # GitHub Packages npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@gracefulinfra"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gen/go/go.mod
          cache-dependency-path: gen/go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          client="$(node -p 'require("./clients/ts/package.json").version')"
          spec="$(node -p 'require("./gen/openapi/relay.v0.json").info.version')"
          echo "tag=$version client=$client spec=$spec"
          [[ "$client" == "$version" && "$spec" == "$version" ]] || { echo "::error::versions differ"; exit 1; }
      - run: make lint
      - run: make test
      - run: make check-generated
      - run: make build
      - name: Publish @gracefulinfra/relay-client
        working-directory: clients/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks --access restricted
      - name: Tag the Go module (gen/go/vX.Y.Z)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/gen/go/${TAG}" -f "sha=${GITHUB_SHA}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          (cd clients/ts && pnpm pack --pack-destination ../../out)
          tar -czf "out/relay-contracts-gen-go-${TAG}.tar.gz" -C gen go
          cp gen/openapi/relay.v0.json out/
          gh release create "$TAG" out/* --verify-tag --title "relay-contracts ${TAG}" \
            --notes "OpenAPI ${TAG}. TS client: @gracefulinfra/relay-client@${TAG#v} (GitHub Packages). Go stub: go get github.com/gracefulinfra/relay-contracts/gen/go@${TAG}."
