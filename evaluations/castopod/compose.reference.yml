# Reference Compose for the P0-02 Castopod evaluation (default local-disk instance).
# Secret VALUES come from a generated, gitignored .env (never committed).
# The S3-backed variant adds SeaweedFS + CP_MEDIA_* pointing at the bucket; see evaluations/castopod.md W-S3.

# P0-02 Castopod evaluation — derived from https://docs.castopod.org/main/en/getting-started/docker/
# Pinned by digest; secrets come from .env (generated, never committed).
services:
  castopod:
    image: castopod/castopod:1.15.6@sha256:bb9cf0970b88bb722746a6c2960e2862f484411ab1080a2876543170ca504853
    volumes:
      - castopod-media:/app/public/media
    environment:
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: ${DB_PW}
      CP_BASEURL: "http://localhost:8080"
      CP_ANALYTICS_SALT: ${ANALYTICS_SALT}
      CP_CACHE_HANDLER: redis
      CP_DISABLE_HTTPS: "1" # documented testing switch; federation requires HTTPS
      CP_EMAIL_SMTP_HOST: mailpit
      CP_EMAIL_SMTP_PORT: "1025"
      CP_EMAIL_SMTP_USERNAME: relay
      CP_EMAIL_SMTP_PASSWORD: local-only
      CP_EMAIL_FROM: castopod@relay.test
      email_SMTPCrypto: "" # CI4 native override; wrapper only allows ssl|tls and Mailpit is plaintext
      CP_REDIS_HOST: redis
      CP_REDIS_PASSWORD: ${REDIS_PW}
    networks: [castopod-app, castopod-db]
    ports: ["8080:8080"]
    depends_on:
      mariadb: { condition: service_healthy }
      redis: { condition: service_started }
  mailpit: # local SMTP catcher for invite / magic-link emails
    image: axllent/mailpit:v1.33@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    environment: { MP_SMTP_AUTH_ACCEPT_ANY: "1", MP_SMTP_AUTH_ALLOW_INSECURE: "1" }
    networks: [castopod-app]
    ports: ["8025:8025"]
  mariadb:
    image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    networks: [castopod-db]
    volumes: [castopod-db:/var/lib/mysql]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PW}
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: ${DB_PW}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
  redis:
    image: redis:8.10-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PW"']
    environment:
      REDIS_PW: ${REDIS_PW}
    volumes: [castopod-cache:/data]
    networks: [castopod-app]
volumes: { castopod-media: {}, castopod-db: {}, castopod-cache: {} }
networks:
  castopod-app: {}
  castopod-db: { internal: true }
